<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>datalist</title>
</head>

<body>

    <!-- Datalist Specifies pre-define Elements for input elements -->
    <label for="tick">Select Your States.</label>
    <input type="range" list="tickmarks" id="tick" min="0" max="100">
    <datalist id="tickmarks">
        <option value="0">
        <option value="10">
        <option value="20">
        <option value="30">
    </datalist>
</body>

</html>

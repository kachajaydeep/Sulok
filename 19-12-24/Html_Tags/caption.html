<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caption</title>
    <style>
        table,th,td{
            border:1px solid black;
            border-collapse: collapse;
        }
        table{
            width: 100%;
        }
        td{
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Caption tag is immedetly inserted after the table tag it defines the table of the caption. -->
     <!-- Most browser will display caption value in the center. -->
     <table>
        <caption>Weekly Report.</caption>
        <tr>
            <th>Name</th>
            <th>Roll_no</th>
            <th>Details</th>
        </tr>

        <tr>
            <td>Lorem.</td>
            <td>Commodi.</td>
            <td>Rem?</td>
        </tr>
        <tr>
            <td>Lorem.</td>
            <td>Provident.</td>
            <td>Tempora.</td>
        </tr>
        <tr>
            <td>Lorem.</td>
            <td>Aliquam!</td>
            <td>Veritatis.</td>
        </tr>
     </table>
</body>
</html>

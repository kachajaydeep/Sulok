<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify</title>
    <style>
        .container{
            display: grid;
            background-color: blue;
            gap: 10px;
            padding: 10px;
            grid-template-columns: 50px 50px 50px;
            justify-content: center;
        }
        .container > div{
            background-color: rgba(255,255,255,0.8);
            text-align: center;
            font-size: 30px;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
</body>
</html>

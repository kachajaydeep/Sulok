<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>col</title>
    <style>
        table,th,td{
            border: 1px solid black;
            border-collapse: collapse;
        }
        th,td{
            padding: 14px 16px;
        }
    </style>
</head>
<body>
    <!-- col tag is specify property for each column within the colgroup -->
     <!--colgroup tag is useful for applying style to entire columns in table for formating -->
     <table>
        <colgroup>
            <col span="3" style="background-color: red;">
        </colgroup>
        <tr>
            <th>Name</th>
            <th>Roll_Number</th>
            <th>Ids</th>
            <th>EnrollMent_Number</th>
        </tr>

        </tr>

            <td>123457890</td>
        </tr>
        <tr>

        </tr>

        <tr>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mdn</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap:10px;
            grid-auto-rows: minmax(100px, auto);
        }
        .container > div{
            background-color: rgb(233 171 88 / 50%);
            border: 1px solid black;
            padding: 1em;
            color: #d9480f;
        }
        .one {
            grid-column: 1/3;
            grid-row: 1;
        }
        .two{
            grid-column: 2 / 4;
            grid-row: 1/3;
        }
        .three{
            grid-column: 1;
            grid-row: 2 /5;
        }
        .four{
            grid-column: 3;
            grid-row: 3;
        }
        .five{
            grid-column: 3;
            grid-row: 4;
        }
        .six{
            grid-column: 3;
            grid-row: 4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="one">one</div>
        <div class="two">two</div>
        <div class="three">three</div>
        <div class="four">four</div>
        <div class="five">five</div>
    </div>
</body>
</html>

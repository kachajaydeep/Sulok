<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabnsform</title>
    <style>
        div {
            position: relative;
            height: 200px;
            border: 2px solid green;
        }
        div > p {
            margin: 0;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Lorem ipsum dolor sit amet.</p>
    </div>
</body>

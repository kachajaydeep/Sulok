<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background</title>
    <style>
        div {
            /* shorthand property ci rap (color image repeate attachment position) */
            background: rgba(255, 0, 0, 0.5) url('https://imgv3.fotor.com/images/slider-image/A-clear-image-of-a-woman-wearing-red-sharpened-by-Fotors-image-sharpener.jpg') no-repeat scroll center;
            background-size: contain;
            border: 1px solid black;
            padding: 16px 12px;
            text-align: center;
            font-size: 30px;
            font-family: 'Times New Roman', Times, serif;
        }
    </style>
</head>

<body>
    <!-- backgrund property specify the background effect to our html document. -->
    <div>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Expedita, consectetur?</div>
</body>

</html>

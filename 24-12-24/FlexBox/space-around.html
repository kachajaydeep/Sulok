<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>space</title>
    <style>
        .container{
            display: grid;
            gap: 10px;
            padding: 10px;
            grid-template-columns: 50px 50px 50px;
            background-color: pink;
            justify-content: space-between;
        }
        .container>div{
            padding: 20px 0;
            color: #fff;
            font-size: 30px;
            text-align: center;
            background-color: blue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FigureCaption</title>
    <style>
        figure{
            border: 1px #cccccc solid;
            padding: 4px;
            margin: auto;
        }
        figcaption{
            background-color: black;
            color: white;
            font-size: italic;
            padding: 2px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>The figure and figcaption elements + CSS</h1>
    <!-- figcaption is a caption of the image -->
    <!-- figure is used when it is self-contained content like pictures,images,illustration(paintings)-->
     
    <figure>
        <img src="https://www.w3schools.com/tags/pic_trulli.jpg" alt="pic_trulli" style="width: 100%;">
        <figcaption>figure of the Trulli</figcaption>
    </figure>
</body>
</html>

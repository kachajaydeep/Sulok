<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>description</title>
    <style>
        ul{
            list-style-type: square;
        }
    </style>
</head>
<body>
    <dl>
        <dt>coffee</dt>
        <dd>-coffee is best</dd>
    </dl>

    <ul>
        <li>Lorem.</li>
        <li>Ratione!</li>
        <li>Eos!</li>
        <li>Impedit.</li>
    </ul>
            
    <h1>ol defines order list orderlist can be numerical or alphabetical.</h1>
    <ol start="50">
        <li>Lorem.</li>
        <li>Cum.</li>
        <li>Quo!</li>
        <li>Possimus!</li>
    </ol>
</body>
</html>

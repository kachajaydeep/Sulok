<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-templete</title>
    <style>
        .container{
            display: grid;
            gap: 10px;
            background-color: #2196F3;
            grid-template-columns: 80px auto 20px 100px;
            padding: 10px;
        }
        .container >div {
            font-size: 30px;
            text-align: center;
            padding: 20px 0;
            background-color: rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
    </div>
</body>
</html>

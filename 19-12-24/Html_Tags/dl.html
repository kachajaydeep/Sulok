<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Description List</title>
</head>
<body>
    <!-- dl defines description list it is used in conjuction with the dt(description Terms/names) -->
    <dl>
        <dt>Coffee:</dt>
        <dd>-Coffee is so hot.</dd>
        <dt>Milk:</dt>
        <dd>-Milk is good for health.</dd>
    </dl>
</body>
</html>
